services:
  # -------------------------------------------------------------
  # Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: cybershield-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: static
          name: cybershield-frontend
          property: url

  # -------------------------------------------------------------
  # Frontend Static Site (Vite React SPA)
  # -------------------------------------------------------------
  - type: static
    name: cybershield-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
